# CI CD
name: CICD

on:
  push:
    branches:
     - main

    paths-ignore:
      - 'README.md'
      - 'helm/**'

jobs:
  
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build the Go application
        run: go build -o go-web-app .

      - name: Test the Go application
        run: go test ./...
  
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.56.2
  
  docker-push:
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_id }}

  update_tag_in_helm_chart:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update image tag in Helm chart
        run: |
          sed -i "s/tag:.*/tag: \"${{ github.run_id }}\"/" helm/go-web-app-chart/values.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "Chandan S"
          git config --global user.email "chan@users.noreply.github.com"
          git add helm/go-web-app-chart/values.yaml
          git commit -m "Update image tag to ${{ github.run_id }}"
          git push origin main